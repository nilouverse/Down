The Abandoned Fortress
*(Visual: NilouZila materializes in her lavish, stone-walled bedchamber inside the Abyss. The floor is unnervingly still.)*
*(Visual: She rushes to a dark armoire, throwing it open, then checks under the bed. She slams her fist against the wall.)*

NilouZila: "My dark nectar... it's gone! Thieves! Who would dare steal from NilouZila, Binder of Souls?! My rank, my power... it means nothing to them now."

*(Visual: She leaps to the fireplace, prying a loose stone from the hearth. She pulls out a small, glowing vial.)*

NilouZila: *(Sighing in relief)* "Simple is best. The more magical wards you place on something, the more obvious it becomes. At least I have this."

*(Visual: Heavy, violent banging echoes against her chamber door.)*

Vyrxa: *(Muffled, raspy voice outside)* "NilouZila! Open this door at once! I must speak with you!"

NilouZila: *(Scowling)* "Vyrxa. That half-rotten hag. We've despised each other for centuries. She's here to kill me, no doubt thinking I'm weakened."

*(Visual: NilouZila uncorks the vial, drinking half of it. She shudders as power floods back into her veins. She then grabs a sleek, black whip and a vial of shimmering red acid.)*

NilouZila: *(To herself)* "I don't have time for her games. I need to leave before the whole fortress falls."
