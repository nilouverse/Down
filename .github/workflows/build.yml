name: Build

on:
  push:
  workflow_dispatch:
    inputs:
      full:
        description: "true = keep everything in the APK"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Unpack launcher icon
        run: |
          unzip -o res.zip -d app/src/main
          rm res.zip

      - name: Strip for test build
        if: ${{ github.event.inputs.full != 'true' }}
        run: |
          rm -rf app/src/main/assets/art app/src/main/assets/sounds
          cd app/src/main/assets/sprites
          find . -name '*.png' \
            ! -name 'idle.png' ! -name 'glide.png' \
            ! -name 'nilou_idle.png' \
            ! -name 'attack_a.png' ! -name 'attack_b.png' \
            ! -name 'enemy_beast_idle_a.png' ! -name 'enemy_beast_idle_b.png' \
            ! -name 'enemy_beast_glide_a.png' ! -name 'enemy_beast_glide_b.png' \
            ! -name 'enemy_beast_attack.png' -delete

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Down-debug
          path: app/build/outputs/apk/debug/app-debug.apk
