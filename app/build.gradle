apply plugin: 'com.android.application'

android {
    namespace 'com.down.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.down.game"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
